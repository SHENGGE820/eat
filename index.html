<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ 請我吃飯</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft JhengHei', 'PingFang TC', '微軟正黑體', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      overflow: hidden;
    }

    /* ── Sections ── */
    .section {
      position: absolute;
      width: 90%;
      max-width: 520px;
      text-align: center;
      opacity: 0;
      transform: translateY(50px) scale(0.95);
      transition: opacity 0.55s ease, transform 0.55s ease;
      pointer-events: none;
      z-index: 1;
    }
    .section.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }
    .section.exit {
      opacity: 0;
      transform: translateY(-50px) scale(1.05);
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 3rem 2.5rem 2.5rem;
      box-shadow: 0 24px 64px rgba(240,100,130,0.25);
    }

    /* ── Text ── */
    .big-text {
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 900;
      color: #d63384;
      line-height: 1.55;
      margin-bottom: 2rem;
    }

    /* ── Buttons ── */
    button {
      padding: 14px 38px;
      font-size: 1.25rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 800;
      margin: 0.5rem;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-yes {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      box-shadow: 0 8px 22px rgba(245,87,108,0.45);
    }
    .btn-yes:hover { transform: scale(1.1); box-shadow: 0 14px 32px rgba(245,87,108,0.55); }
    .btn-yes:active { transform: scale(0.97); }

    #btnNo {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      box-shadow: 0 8px 22px rgba(245,87,108,0.45);
      position: relative;
      z-index: 100;
      transition: transform 0.22s cubic-bezier(.175,.885,.32,1.275);
    }
    #btnNo:hover { box-shadow: 0 14px 32px rgba(245,87,108,0.55); }

    .btn-main {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      box-shadow: 0 8px 22px rgba(245,87,108,0.45);
      margin-top: 0.5rem;
    }
    .btn-main:hover { transform: scale(1.08); }
    .btn-main:active { transform: scale(0.97); }

    /* ── Date/time inputs ── */
    .dt-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      margin: 0.5rem 0 1.6rem;
    }
    .dt-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      background: linear-gradient(135deg, #fce4f3, #e8d5fb);
      border-radius: 20px;
      padding: 0.9rem 1.4rem 0.75rem;
      width: 280px;
      box-shadow: 0 4px 14px rgba(240,147,251,0.25);
    }
    .dt-label-top {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: #c2185b;
    }
    .dt-icon { font-size: 1.3rem; }
    .dt-row {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cute-sel {
      padding: 9px 8px;
      border: 2.5px solid #f093fb;
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 800;
      color: #c2185b;
      background: #fff;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
      text-align-last: center;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .cute-sel:focus { border-color: #f5576c; box-shadow: 0 0 0 3px rgba(240,147,251,0.28); }
    #selYear  { width: 86px; }
    #selMonth { width: 68px; }
    #selDay   { width: 62px; }
    #selHour  { width: 68px; }
    #selMin   { width: 68px; }
    .ampm-btn {
      padding: 9px 13px;
      font-size: 0.92rem;
      border-radius: 14px;
      border: 2.5px solid #f093fb;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      margin: 0;
      transition: transform 0.15s;
    }
    .ampm-btn:hover { transform: scale(1.08); }

    /* ── Restaurant grid ── */
    .rest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin: 1.4rem 0;
    }
    .btn-rest {
      padding: 20px 10px;
      font-size: 1.05rem;
      border: 2.5px solid #f093fb;
      border-radius: 18px;
      cursor: pointer;
      background: #fff;
      color: #d63384;
      font-weight: 800;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-rest:hover {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      transform: scale(1.06);
      box-shadow: 0 8px 22px rgba(245,87,108,0.4);
    }
    .btn-rest:active { transform: scale(0.97); }

    /* ── Final ── */
    .final-text {
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      color: #c0392b;
      font-weight: 900;
      line-height: 2;
    }

    /* ── Decoration emojis ── */
    .deco {
      display: block;
      font-size: 3.5rem;
      margin: 0.4rem 0 1rem;
      animation: bounce 1.3s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0)    rotate(-6deg); }
      50%      { transform: translateY(-14px) rotate(6deg); }
    }

    /* ── Confetti ── */
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg)   translateX(0);    opacity: 1; }
      100% { transform: translateY(110vh)  rotate(720deg) translateX(var(--dx)); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ────────── Section 1 ────────── -->
  <div class="section active" id="s1">
    <div class="card">
      <div class="big-text">要不要請我吃飯阿<br></div>
      <div>
        <button class="btn-yes" onclick="goTo(2)">要 ✨</button>
        <button id="btnNo" onclick="runAway()">不要</button>
      </div>
    </div>
  </div>

  <!-- ────────── Section 2 ────────── -->
  <div class="section" id="s2">
    <div class="card">
      <span class="deco">🎊</span>
      <div class="big-text">確定喔<br>(◔౪◔)</div>
      <button class="btn-main" onclick="goTo(3)">沒錯沒錯！</button>
    </div>
  </div>

  <!-- ────────── Section 3 ────────── -->
  <div class="section" id="s3">
    <div class="card">
      <div class="big-text">那你要哪天請我吃飯啊<br></div>
      <div class="dt-wrap">
        <label class="dt-label">
          <div class="dt-label-top"><span class="dt-icon">📅</span> 選個日期</div>
          <div class="dt-row">
            <select id="selYear" class="cute-sel"></select>
            <select id="selMonth" class="cute-sel"></select>
            <select id="selDay" class="cute-sel"></select>
          </div>
        </label>
        <label class="dt-label">
          <div class="dt-label-top"><span class="dt-icon">🕐</span> 幾點幾分</div>
          <div class="dt-row">
            <select id="selHour" class="cute-sel"></select>
            <select id="selMin" class="cute-sel"></select>
            <button id="btnAmpm" type="button" class="ampm-btn" onclick="toggleAmpm()">上午</button>
          </div>
        </label>
      </div>
      <button class="btn-main" onclick="goTo(4)">選好了</button>
    </div>
  </div>

  <!-- ────────── Section 4 ────────── -->
  <div class="section" id="s4">
    <div class="card">
      <div class="big-text">那要去吃啥</div>
      <div class="rest-grid">
        <!-- 餐廳名稱直接改這裡 -->
        <button class="btn-rest" onclick="pickRest(this)">屋馬</button>
        <button class="btn-rest" onclick="pickRest(this)">茶六</button>
        <button class="btn-rest" onclick="pickRest(this)">橘色</button>
        <button class="btn-rest" onclick="pickRest(this)">饗 A Joy</button>
        <button class="btn-rest" onclick="pickRest(this)">鼎泰豐</button>
        <button class="btn-rest" onclick="pickRest(this)">旭集</button>
      </div>
    </div>
  </div>

  <!-- ────────── Section 5 ────────── -->
  <div class="section" id="s5">
    <div class="card">
      <span class="deco">🎉</span>
      <div class="final-text" id="finalText"></div>
    </div>
  </div>

<script>
  let cur = 1;
  let selDate = '', selTime = '', selRest = '';

  /* ── "不要" 平移跳走 ── */
  let _noOrig = null;

  function runAway() {
    const btn = document.getElementById('btnNo');

    // 第一次記錄原始位置（未加 transform 前）
    if (!_noOrig) {
      btn.style.transform = 'none';
      _noOrig = btn.getBoundingClientRect();
    }

    const pad = 24;
    // 目標視窗坐標（隨機）
    const tx_vp = pad + Math.random() * (window.innerWidth  - btn.offsetWidth  - pad * 2);
    const ty_vp = pad + Math.random() * (window.innerHeight - btn.offsetHeight - pad * 2);
    // 相對原始位置的平移量
    btn.style.transform = `translate(${tx_vp - _noOrig.left}px, ${ty_vp - _noOrig.top}px)`;
  }

  /* ── Custom picker init ── */
  let _ampm = '上午';
  function toggleAmpm() {
    _ampm = _ampm === '上午' ? '下午' : '上午';
    document.getElementById('btnAmpm').textContent = _ampm;
  }
  function populatePickers() {
    const now = new Date();
    const yr = document.getElementById('selYear');
    for (let y = now.getFullYear(); y <= now.getFullYear() + 1; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y + ' 年';
      yr.appendChild(o);
    }
    const mo = document.getElementById('selMonth');
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m + ' 月';
      if (m === now.getMonth() + 1) o.selected = true;
      mo.appendChild(o);
    }
    function fillDays() {
      const y = +document.getElementById('selYear').value;
      const m = +document.getElementById('selMonth').value;
      const days = new Date(y, m, 0).getDate();
      const prev = +document.getElementById('selDay').value || now.getDate();
      const dy = document.getElementById('selDay');
      dy.innerHTML = '';
      for (let d = 1; d <= days; d++) {
        const o = document.createElement('option');
        o.value = d; o.textContent = d + ' 日';
        if (d === (prev <= days ? prev : days)) o.selected = true;
        dy.appendChild(o);
      }
    }
    fillDays();
    document.getElementById('selYear').addEventListener('change', fillDays);
    document.getElementById('selMonth').addEventListener('change', fillDays);
    const hr = document.getElementById('selHour');
    for (let h = 1; h <= 12; h++) {
      const o = document.createElement('option');
      o.value = h; o.textContent = h + ' 點';
      if (h === (now.getHours() % 12 || 12)) o.selected = true;
      hr.appendChild(o);
    }
    const mn = document.getElementById('selMin');
    for (let m = 0; m < 60; m += 5) {
      const o = document.createElement('option');
      o.value = m; o.textContent = String(m).padStart(2,'0') + ' 分';
      mn.appendChild(o);
    }
    _ampm = now.getHours() >= 12 ? '下午' : '上午';
    document.getElementById('btnAmpm').textContent = _ampm;
  }
  document.addEventListener('DOMContentLoaded', populatePickers);

  /* ── Section transition ── */
  function goTo(n) {
    if (n === 4) {
      const y  = +document.getElementById('selYear').value;
      const mo = +document.getElementById('selMonth').value;
      const d  = +document.getElementById('selDay').value;
      const h12 = +document.getElementById('selHour').value;
      const mi = +document.getElementById('selMin').value;
      let h = h12 % 12 + (_ampm === '下午' ? 12 : 0);
      const dt = new Date(y, mo - 1, d, h, mi);
      const wd = ['日','一','二','三','四','五','六'][dt.getDay()];
      selDate = `${mo}月${d}日（週${wd}）`;
      selTime = `${_ampm} ${h12}:${String(mi).padStart(2,'0')}`;
    }

    const old = document.getElementById('s' + cur);
    old.classList.add('exit');
    old.classList.remove('active');

    if (n === 2) document.getElementById('btnNo').style.visibility = 'hidden';

    setTimeout(() => {
      old.classList.remove('exit');
      document.getElementById('s' + n).classList.add('active');
      cur = n;
    }, 480);
  }

  /* ── Restaurant pick ── */
  /* ── Discord 通知 ── */
  const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1508796269026480198/7pHIHYmbVh5y4VmxOHNxyEWLYAltQmme3z-uVJT9guBd3qztPpFHWiXVsi1zpENK1I5M';

  function notifyDiscord() {
    if (!DISCORD_WEBHOOK || DISCORD_WEBHOOK.includes('在這裡')) return;
    fetch(DISCORD_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content: `🎉 **有人答應吃飯了！**\n📅 ${selDate}\n🕐 ${selTime}\n🍽️ ${selRest}`
      })
    }).catch(() => {});
  }

  function pickRest(btn) {
    selRest = btn.textContent.trim();
    launchConfetti();
    notifyDiscord();

    const old = document.getElementById('s4');
    old.classList.add('exit');
    old.classList.remove('active');

    setTimeout(() => {
      old.classList.remove('exit');
      document.getElementById('finalText').innerHTML =
        `那就這樣囉<br>` +
        `📅 ${selDate}<br>` +
        `🕐 ${selTime}<br>` +
        `🍽️ ${selRest}<br><br>`;
      document.getElementById('s5').classList.add('active');
      cur = 5;
    }, 480);
  }

  /* ── Confetti ── */
  function launchConfetti() {
    const colors = ['#f093fb','#f5576c','#ffd93d','#6bcb77','#4d96ff','#ff6b6b','#ffa552'];
    for (let i = 0; i < 90; i++) {
      setTimeout(() => {
        const el   = document.createElement('div');
        const size = 7 + Math.random() * 11;
        const dur  = 1.6 + Math.random() * 2;
        const dx   = (Math.random() - 0.5) * 300;
        el.style.cssText = `
          position:fixed; pointer-events:none; z-index:9999;
          left:${Math.random()*100}vw; top:-20px;
          width:${size}px; height:${size * (Math.random()>.5 ? 1 : 2.8)}px;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          border-radius:${Math.random()>.5 ? '50%' : '3px'};
          --dx:${dx}px;
          animation:confettiFall ${dur}s linear forwards;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 200);
      }, i * 35);
    }
  }
</script>
</body>
</html>
